<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7b1e2e"><link rel="icon" href="icon-192.png"><title>SLAW - تصميم الدخول</title>
<style>
:root{--bg:#1a0d0f;--card:#2a1519;--m:#7b1e2e;--b:#8b5a3c;--t:#f5e9e2;--mu:#b9a29a;--ln:#4a2a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.s{display:none;min-height:100vh;padding:28px 22px;flex-direction:column;justify-content:center;gap:14px;max-width:460px;margin:auto;animation:f .3s}
.s.on{display:flex}@keyframes f{from{opacity:0;transform:translateY(10px)}}
h1{margin:0;font-size:30px;text-align:center;letter-spacing:4px;background:linear-gradient(90deg,#c0425a,#c98a5e);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0;text-align:center;font-size:22px}p{margin:0;color:var(--mu);text-align:center;line-height:1.7}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--t);font-size:16px;text-align:center;outline:none}
input:focus{border-color:var(--b)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:700;background:linear-gradient(90deg,var(--m),var(--b));cursor:pointer}
.btn:active{transform:scale(.97)}.btn.g{background:transparent;border:1px solid var(--b);color:var(--t)}
.lnk{background:none;border:0;color:#d9a37c;font-size:14px;cursor:pointer;padding:6px}
.err{color:#ff7b7b;text-align:center;min-height:20px;font-size:14px}
.lock{font-size:64px;text-align:center;animation:pl 2s infinite}@keyframes pl{50%{transform:scale(1.12)}}
.stars{text-align:center;font-size:26px;letter-spacing:6px;color:#d9a37c;animation:pl 2.4s infinite}
.chips{display:flex;gap:8px}.chip{flex:1;padding:12px 4px;border-radius:12px;background:var(--card);border:1px solid var(--ln);color:var(--t);font-size:15px;cursor:pointer}
.chip.a{border-color:#c0425a}
.wheel{height:160px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:60px 0;background:var(--card);border-radius:12px;border:1px solid var(--ln);scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}.it{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;color:var(--mu);font-size:18px}
.it.sel{color:var(--t);font-weight:700;font-size:22px}
.gm{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700}.gm svg{width:38px;height:38px}
.code{display:flex;gap:6px;align-items:center}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.hint{font-size:12px;color:var(--mu);text-align:center;border:1px dashed var(--ln);padding:8px;border-radius:10px}
.md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:20px}.md.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--m)}
.pw{position:relative}.pw button{position:absolute;left:8px;top:8px}
</style>
</head>
<body>

<div class="s on" id="login"><h1>SLAW</h1><h2>أهلاً بك</h2><p>سجّل دخولك بحساب Google للمتابعة</p><button class="btn" id="gb" onclick="googleLogin()" style="display:flex;align-items:center;justify-content:center;gap:10px"><span style="background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 48 48" width="22" height="22"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></span>المتابعة بحساب Google</button><div class="err" id="lerr"></div></div>

<div class="s" id="name"><h2>اسمك؟</h2><input id="nm" placeholder="اكتب اسمك" maxlength="30"><div class="err" id="nerr"></div><button class="btn" onclick="nextName()">التالي</button><button class="lnk" onclick="doOut()">رجوع</button></div>

<div class="s" id="age"><h2>عمرك؟</h2><p>اختر تاريخ ميلادك</p>
<div class="chips"><button class="chip a" id="cy" onclick="pick('y')">السنة</button><button class="chip" id="cm" onclick="pick('m')">الشهر</button><button class="chip" id="cd" onclick="pick('d')">اليوم</button></div>
<div class="wheel" id="wy"></div><div class="wheel" id="wm" hidden></div>
<input id="di" inputmode="numeric" placeholder="اليوم (1 - 31)" hidden>
<div class="err" id="aerr"></div><button class="btn" onclick="nextAge()">إنهاء</button></div>

<div class="s" id="home" style="justify-content:flex-start">
<div class="top"><h1 style="font-size:24px">SLAW</h1><span id="hid" style="color:var(--mu);font-size:13px"></span></div>
<h2 id="hw"></h2><p>لا توجد محادثات بعد.<br>طلبات الصداقة ستظهر هنا.</p>
<button class="btn g" onclick="doOut()">تسجيل الخروج</button></div>

<div class="md" id="md"><div class="box"><h2>اقتراح</h2>
<button class="btn" onclick="toast('اختيار الصورة قيد التصميم');close_()">تعيين صورة بروفايل</button>
<button class="btn" onclick="toast('البحث بالمعرّف قيد التصميم');close_()">ابحث عن صديق!</button>
<button class="lnk" onclick="close_()">لاحقاً</button></div></div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get,set}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBlIyelgyQBD0jHPpKve2TOjH1OnZS5LMs",authDomain:"slaw-3a991.firebaseapp.com",databaseURL:"https://slaw-3a991-default-rtdb.europe-west1.firebasedatabase.app",projectId:"slaw-3a991",storageBucket:"slaw-3a991.firebasestorage.app",messagingSenderId:"989570314649",appId:"1:989570314649:web:cb29cd40127e93f2a0e308"});
const auth=getAuth(app),db=getDatabase(app);
const $=i=>document.getElementById(i);let D={},Y=null,M=null,busy=false;
const MO=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const go=id=>{document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200)};
function mkWheel(id,items,cb){const w=$(id);w.innerHTML=items.map(t=>'<div class="it">'+t+'</div>').join('');w.onscroll=()=>{const i=Math.max(0,Math.min(items.length-1,Math.round(w.scrollTop/40)));w.querySelectorAll('.it').forEach((e,j)=>e.classList.toggle('sel',j===i));cb(i)}}
function mkWheels(){const ys=[];for(let y=2012;y>=1890;y--)ys.push(y);mkWheel('wy',ys,i=>{Y=ys[i];$('cy').textContent=Y});mkWheel('wm',MO,i=>{M=i+1;$('cm').textContent=MO[i]});pick('y')}
function pick(k){$('wy').hidden=k!='y';$('wm').hidden=k!='m';$('di').hidden=k!='d';['y','m','d'].forEach(x=>$('c'+x).classList.toggle('a',x==k));if(k!='d'){const w=$(k=='y'?'wy':'wm');w.scrollTop+=1;w.scrollTop-=1;w.dispatchEvent(new Event('scroll'))}}
$('di').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,2);if(+this.value>31)this.value='31';$('cd').textContent=this.value||'اليوم'};
function nextName(){const n=$('nm').value.trim();if(n.length<2){$('nerr').textContent='اكتب اسمك';return}D.name=n;$('nerr').textContent='';go('age');mkWheels()}
async function nextAge(){if(busy)return;const d=+$('di').value;if(!Y||!M||d<1||d>31){$('aerr').textContent='أكمل السنة والشهر واليوم';return}
busy=true;$('aerr').textContent='جاري الحفظ...';const u=auth.currentUser;
try{await mkProfile(u,{name:D.name,dob:Y+'-'+M+'-'+d});$('aerr').textContent='';await finish(u)}catch(e){$('aerr').textContent='تعذّر الحفظ: '+(e.code||e.message)}busy=false}
async function mkProfile(u,p){let id=null;for(let i=0;i<6&&!id;i++){const c=String(Math.floor(1000000+Math.random()*9000000));try{await set(ref(db,'userIds/'+c),u.uid);id=c}catch(e){}}
if(!id)throw new Error('تعذر إنشاء المعرّف');await set(ref(db,'users/'+u.uid),{email:u.email,dob:p.dob,createdAt:Date.now()});await set(ref(db,'profiles/'+u.uid),{name:p.name,id:id,photo:'',bio:''})}
async function finish(u){try{const s=await get(ref(db,'profiles/'+u.uid));
if(!s.exists()){$('nm').value=(u.displayName||'').slice(0,30);go('name');return}
const p=s.val();$('hw').textContent='أهلاً '+p.name;$('hid').textContent='المعرّف: '+p.id;go('home');
if(!ld('slaw_sug')){sv('slaw_sug',1);setTimeout(()=>$('md').classList.add('on'),500)}}catch(e){$('lerr').textContent='خطأ: '+(e.code||e.message);go('login')}}
async function googleLogin(){if(busy)return;busy=true;$('lerr').textContent='';const pr=new GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
try{await signInWithPopup(auth,pr)}catch(e){
if(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment'){try{await signInWithRedirect(auth,pr)}catch(x){$('lerr').textContent='خطأ: '+(x.code||x.message)}}
else if(e.code!='auth/popup-closed-by-user'&&e.code!='auth/cancelled-popup-request')$('lerr').textContent=e.code=='auth/unauthorized-domain'?'النطاق غير مصرّح في Firebase':e.code=='auth/network-request-failed'?'لا يوجد اتصال بالإنترنت':'خطأ: '+(e.code||e.message)}
busy=false}
async function doOut(){await signOut(auth).catch(()=>{});go('login')}
onAuthStateChanged(auth,u=>{if(u&&$('login').classList.contains('on'))finish(u)});
Object.assign(window,{nextName,pick,nextAge,googleLogin,doOut,go,close_:()=>$('md').classList.remove('on'),toast});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
